# Publish @adfinia/sdk-web to npm on tag push.
#
# Trigger: pushing a tag matching `sdk-web-v*` (e.g. `sdk-web-v1.0.0`).
# The founder owns the tag-push step.
#
# Safety:
#   - Tag version (sdk-web-vX.Y.Z) must match package.json `version`. A
#     mismatch fails the workflow before any publish.
#   - Missing NPM_TOKEN is logged + exit 0 (re-tag without the secret
#     never breaks the build; the founder just re-pushes after adding
#     the secret).
#
# NOTE: `--provenance` is intentionally omitted — granular tokens can't
# do provenance without npm trusted-publisher (OIDC) setup. Revisit in
# v1.1.

name: Publish Web SDK

on:
  push:
    tags:
      - 'sdk-web-v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Verify tag matches package.json version
        run: |
          TAG_REF="${GITHUB_REF#refs/tags/sdk-web-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_REF" != "$PKG_VERSION" ]; then
            echo "::error::Tag sdk-web-v${TAG_REF} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
          echo "Tag and package.json agree on v${PKG_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::warning::NPM_TOKEN secret is not set — skipping publish (re-tag after adding the secret)."
            exit 0
          fi
          npm publish --access public
