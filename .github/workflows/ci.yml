name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: web-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --coverage
      - name: Upload coverage
        if: matrix.node == '20'
        uses: actions/upload-artifact@v4
        with:
          name: sdk-web-coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check bundle size
        run: |
          set -e
          SIZE=$(stat -c%s dist/adfinia.iife.js 2>/dev/null || stat -f%z dist/adfinia.iife.js)
          # Budget bumped 15000 -> 24000 for v1.2.0: web-push client, first-touch
          # acquisition capture, auto-page, and external_id identity add ~5.5 KB
          # raw (~2 KB gzipped). Still under 8 KB on the wire after gzip.
          MAX=24000
          echo "IIFE bundle: $SIZE bytes (max $MAX)"
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "::error::IIFE bundle exceeded $MAX bytes"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-web-dist
          path: dist/
          retention-days: 14

  publish-dry-run:
    name: Publish dry-run
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - run: npm publish --dry-run --access public
